apiVersion: v1
kind: Namespace
metadata:
  name: m365ops-app
  labels: { pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: api-config }
data:
  NODE_ENV: production
  PORT: "3001"
  WEB_ORIGIN: https://m365ops.example.invalid
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: m365ops-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: m365ops-api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.example.invalid/m365ops-api:0.1.0
          ports: [{ name: http, containerPort: 3001 }]
          envFrom: [{ configMapRef: { name: api-config } }, { secretRef: { name: api-runtime } }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app.kubernetes.io/name: m365ops-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: m365ops-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: m365ops-web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: registry.example.invalid/m365ops-web:0.1.0
          ports: [{ name: http, containerPort: 3000 }]
          env: [{ name: PORT, value: "3000" }, { name: HOSTNAME, value: "0.0.0.0" }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app.kubernetes.io/name: m365ops-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  annotations: { nginx.ingress.kubernetes.io/ssl-redirect: "true" }
spec:
  ingressClassName: nginx
  tls: [{ hosts: [m365ops.example.invalid], secretName: edge-tls }]
  rules:
    - host: m365ops.example.invalid
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /health, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ingress-to-web-api }
spec:
  podSelector:
    matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [m365ops-web, m365ops-api] }]
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ protocol: TCP, port: 3000 }, { protocol: TCP, port: 3001 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: m365ops-api } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: m365ops-web } } }

